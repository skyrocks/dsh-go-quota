<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="输入框下方的 OpenCode GO 三窗口用量条示意图">
  <title>输入框下方的 OpenCode GO 三窗口用量条</title>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="760" height="200" fill="#ffffff"/>
  <rect x="40" y="22" width="680" height="100" rx="16" fill="#ffffff" stroke="#e6e8eb" filter="url(#card-shadow)"/>
  <text x="64" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#a0a4ab">给 DeepSeek Harness 写一个插件…</text>
  <circle cx="676" cy="72" r="15" fill="#eef1f5"/>
  <path d="M670 72h12M677 67l5 5-5 5" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- context meter -->
  <circle cx="150" cy="152" r="8" fill="none" stroke="#d9dde3" stroke-width="3"/>
  <circle cx="150" cy="152" r="8" fill="none" stroke="#4d6bfe" stroke-width="3" stroke-linecap="round" stroke-dasharray="18.6 31.7" transform="rotate(-90 150 152)"/>
  <text x="164" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6b7280">37%</text>
  <line x1="205" y1="143" x2="205" y2="161" stroke="#eceef1" stroke-width="1"/>

  <!-- GO dock -->
  <text x="218" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="600" letter-spacing="0.4" fill="#8a8f98">GO</text>

  <text x="248" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8a8f98">5h</text>
  <rect x="268" y="148" width="64" height="6" rx="3" fill="#d9dde3"/>
  <rect x="268" y="148" width="20.5" height="6" rx="3" fill="#6bd586"/>
  <text x="338" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6b7280">32%</text>

  <text x="378" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8a8f98">周</text>
  <rect x="398" y="148" width="64" height="6" rx="3" fill="#d9dde3"/>
  <rect x="398" y="148" width="11.5" height="6" rx="3" fill="#6bd586"/>
  <text x="468" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6b7280">18%</text>

  <text x="508" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#8a8f98">月</text>
  <rect x="528" y="148" width="64" height="6" rx="3" fill="#d9dde3"/>
  <rect x="528" y="148" width="5.8" height="6" rx="3" fill="#6bd586"/>
  <text x="598" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#6b7280">9%</text>

  <text x="40" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#9aa0a6">示意图：5 小时 / 本周 / 本月三个窗口，排在上下文占用百分比之后</text>
