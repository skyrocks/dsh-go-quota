<svg xmlns="http://www.w3.org/2000/svg" width="380" height="250" viewBox="0 0 380 250" role="img" aria-label="悬浮详情面板示意图">
  <title>悬浮详情面板</title>
  <defs>
    <filter id="panel-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="380" height="250" fill="#ffffff"/>
  <rect x="20" y="14" width="340" height="206" rx="12" fill="#ffffff" stroke="#e6e8eb" filter="url(#panel-shadow)"/>

  <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2329">OpenCode GO 套餐额度</text>
  <text x="344" y="44" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#8a8f98">更新 15:31</text>

  <!-- 5h 32% green -->
  <text x="36" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b7280">5 小时</text>
  <rect x="100" y="77" width="165" height="6" rx="3" fill="#d9dde3"/>
  <rect x="100" y="77" width="52.8" height="6" rx="3" fill="#6bd586"/>
  <text x="344" y="84" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b7280">32%</text>
  <text x="344" y="99" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#9aa0a6">3 小时后重置</text>

  <!-- week 84% amber -->
  <text x="36" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b7280">本周</text>
  <rect x="100" y="121" width="165" height="6" rx="3" fill="#d9dde3"/>
  <rect x="100" y="121" width="138.6" height="6" rx="3" fill="#e6a23c"/>
  <text x="344" y="128" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#b45309">84%</text>
  <text x="344" y="143" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#9aa0a6">5 天后重置</text>

  <!-- month 91% red -->
  <text x="36" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#6b7280">本月</text>
  <rect x="100" y="165" width="165" height="6" rx="3" fill="#d9dde3"/>
  <rect x="100" y="165" width="150.15" height="6" rx="3" fill="#e5484d"/>
  <text x="344" y="172" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#e5484d">91%</text>
  <text x="344" y="187" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#9aa0a6">18 天后重置</text>

  <text x="20" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#9aa0a6">示意图：悬浮详情（≥80% 琥珀，≥90% 红）</text>
</svg>
